[package]
name = "kanban-app"
version = "0.3.0"
description = "Kanban desktop shell: runs the board daemon and shows the board with an embedded terminal (PRD-07)"
edition = "2021"
publish = false

[lib]
name = "kanban_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "kanban-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
